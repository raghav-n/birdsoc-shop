name: Django Oscar CI/CD

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ "event-sites/**", ".github/workflows/deploy-*.yml" ]
  pull_request:
    branches: [ main, master ]
    paths-ignore: [ "event-sites/**", ".github/workflows/deploy-*.yml" ]

permissions:
  contents: read

jobs:
  test:
    environment: test
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      env:
        SECRET_KEY: ci-test-secret-key
        JWT_SECRET: ci-test-jwt-secret
        GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
        GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
        GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        GMAIL_ALLOWED_FROM_ADDRESSES: ${{ secrets.GMAIL_ALLOWED_FROM_ADDRESSES }}
        SALES_EMAIL: ${{ vars.SALES_EMAIL }}
        DEFAULT_FROM_EMAIL: ${{ vars.DEFAULT_FROM_EMAIL }}

      run: |
        python manage.py test -v 2

  frontend-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    # Same toolchain as the VPS deploy (Node 22, npm 11.6.2), so a lockfile the
    # deploy's `npm ci` would reject fails here first.
    - name: Install Frontend Dependencies
      working-directory: frontend
      run: |
        npm install -g npm@11.6.2 --no-audit --no-fund
        npm ci

    - name: Run Frontend Tests
      working-directory: frontend
      run: npm test

    - name: Frontend production build
      working-directory: frontend
      run: npm run build

  deploy:
    needs: [test, frontend-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Deploy to production
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
        SSH_PORT: ${{ secrets.SSH_PORT }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "${SSH_USER}@${SSH_HOST}" "
          set -e
          cd /srv/shop
          git config --global --add safe.directory /srv/shop
          git pull
          # Python: venv is a symlink to venv-<X.Y> built on the shared uv-managed
          # interpreter (/usr/local/bin/python3.14). To move to a new version, build
          # venv-<X.Y> by hand, then merge the PR that sets PYV: the deploy installs
          # into it and swaps the symlink just before migrate + restart.
          PYV=3.14
          if [ -d venv-\$PYV ] && [ \"\$(readlink venv)\" != venv-\$PYV ]; then VENV=venv-\$PYV; else VENV=venv; fi
          \$VENV/bin/python -c \"import sys; v = '%d.%d' % sys.version_info[:2]; sys.exit(0 if v == '\$PYV' else '\$VENV is Python ' + v + ', expected \$PYV: build /srv/shop/venv-\$PYV first')\"
          uv pip install --python \$VENV/bin/python -r requirements.txt
          \$VENV/bin/python manage.py collectstatic --noinput
          cd frontend && npm ci --silent && npm run build && cd ..
          if [ \$VENV != venv ]; then
            [ -L venv ] || mv venv venv-old-\$(date +%Y%m%d%H%M)
            ln -sfn venv-\$PYV venv
          fi
          # Migrate last and restart straight after: new columns without a DB
          # default break the old code's inserts, so keep that window short.
          venv/bin/python manage.py migrate --noinput
          sudo systemctl restart birdsoc
        "

  deploy-apps-script:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - name: Check for Apps Script changes
      id: changed
      run: |
        if git diff --name-only HEAD^ HEAD | grep -q '^scripts/apps-script/'; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node.js
      if: steps.changed.outputs.changed == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Install clasp
      if: steps.changed.outputs.changed == 'true'
      run: npm install -g @google/clasp

    - name: Write clasp credentials
      if: steps.changed.outputs.changed == 'true'
      env:
        CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      run: |
        if [ -z "$CLASPRC_JSON" ]; then
          echo "::error::CLASPRC_JSON secret is not set"
          exit 1
        fi
        printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

    - name: Push Apps Script
      if: steps.changed.outputs.changed == 'true'
      working-directory: scripts/apps-script
      run: clasp push --force
